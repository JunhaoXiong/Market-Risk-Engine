# Phase 1 configuration. Every modelling assumption lives here so it is visible and reviewable.
portfolio:
  value: 1000000            # USD
  weights:                  # constant weights (implicit daily rebalancing)
    SPY: 0.40
    QQQ: 0.30
    TLT: 0.20
    GLD: 0.10

data:
  source: yfinance
  auto_adjust: true         # adjusted close = total-return series (dividends reinvested)
  start: "2006-01-01"
  end: "2025-12-31"         # inclusive; fixed end date for reproducibility
  cache_path: data/raw/prices.csv

quality:
  stale_run_days: 5         # flag >= N consecutive identical prices
  extreme_return_abs: 0.15  # flag |simple daily return| above this (flagged, never removed)
  max_calendar_gap_days: 5  # flag gaps between consecutive dates longer than this

risk:
  confidence_levels: [0.95, 0.99]
  horizon_days: 1
  quantile_method: linear   # numpy quantile interpolation for historical VaR
  normal_include_mean: true # Normal VaR uses the sample mean; set false for mu = 0

models:
  estimation_window: 500    # primary rolling window (Phase 2 report was generated with 1000)
  ewma_burn_in: 30          # returns used only to seed the EWMA recursion
  garch_primary_dist: t     # Student-t innovations (primary)
  garch_benchmark_dist: normal

backtest:
  oos_start_index: 1000     # first forecast = return #1000 (2009-12-23); common to all windows
  refit_every: 21           # primary: refit GARCH / EWMA lambda every 21 trading days
  sensitivity_windows: [250, 1000]
  sensitivity_refit_every: 1   # benchmark: daily refit (GARCH only)
  significance: [0.05, 0.01]   # primary 5%, sensitivity 1%

stress:
  method_primary: buy_and_hold   # positions fixed during the scenario
  method_benchmark: rebalanced   # daily rebalanced to target weights
  historical:
    - {name: "GFC peak-to-trough", start: "2007-10-09", end: "2009-03-09"}
    - {name: "Post-Lehman", start: "2008-09-12", end: "2008-11-20"}
    - {name: "COVID crash", start: "2020-02-19", end: "2020-03-23"}
    - {name: "2022 rate shock", start: "2021-12-31", end: "2022-10-12"}
    - {name: "2018 Q4 selloff", start: "2018-09-20", end: "2018-12-24"}
    - {name: "2013 taper tantrum", start: "2013-05-21", end: "2013-06-24"}
  hypothetical:
    - {name: "Equity crash", shocks: {SPY: -0.20, QQQ: -0.20, TLT: 0.05, GLD: 0.03}}
    - {name: "Stagflation", shocks: {SPY: -0.15, QQQ: -0.15, TLT: -0.10, GLD: 0.08}}
    - {name: "Rate shock", shocks: {SPY: -0.08, QQQ: -0.08, TLT: -0.15}}
  conditional:
    shocks: {SPY: -0.10}
    covariance_periods:          # covariance estimated on these windows (daily returns)
      - {name: "Calm 2017", start: "2017-01-01", end: "2017-12-31"}
      - {name: "GFC 2008-09..2009-03", start: "2008-09-01", end: "2009-03-31"}
      - {name: "2022 rate shock", start: "2022-01-01", end: "2022-12-31"}

attribution:
  covariance_primary: ewma       # EWMA with MLE lambda on the estimation window, zero mean
  rolling_lambda: 0.94           # fixed RiskMetrics lambda for the 2006-2025 contribution path

optimization:
  cash_rate_cache: data/raw/irx.csv   # 13-week T-bill (^IRX), used for cash return and Sharpe
  upper_bound: 0.60                   # max weight per asset
  cost_bps: 5                         # one-way transaction cost
  window: 500                         # trailing window for LW / CVaR / lambda MLE
  lambda_refit_every: 21              # multivariate EWMA lambda re-estimated every 21 days
  vol_target: 0.10                    # annualised; primary
  vol_target_sensitivity: [0.08, 0.12]
  threshold: 0.05                     # rebalance when any |target - held| > 5pp; primary
  threshold_sensitivity: [0.025, 0.10]
  calendar_rebalance_every: 21        # comparison: fixed monthly rebalancing
  cvar_alpha: 0.95                    # optimise CVaR at 95% (99% has ~5 tail days in 500)
